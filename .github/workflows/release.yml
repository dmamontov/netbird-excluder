name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binaries
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
        run: |
          mkdir -p dist
          GOARCH=arm64 go build -o dist/netbird-excluder-darwin-arm64 .
          GOARCH=amd64 go build -o dist/netbird-excluder-darwin-amd64 .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
