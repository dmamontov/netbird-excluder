name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build ./...
        env:
          GOOS: darwin
          GOARCH: arm64
      - run: go vet ./...
        env:
          GOOS: darwin
          GOARCH: arm64
